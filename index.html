<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noo</title>
    <link rel="icon" href="assets/nerd.svg" type="image/svg+xml">
    <style>
        @font-face {
            font-family: "Noto Sans";
            src: url("fonts/NotoSans-VariableFont_wdth,wght.ttf") format("truetype");
            font-weight: 300 700;
            font-style: normal;
        }

        :root {
            --container-size: 100%;
            --flex-gap: 12px;
        }

        body {
            margin: 0;
            font-family: "Noto Sans";
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            /* width: var(--container-size);
            height: var(--container-size); */
            width: 100%;
            height: 100%;
        }

        button,
        input {
            flex: 1;
            min-width: 0px;
            box-sizing: border-box;
            text-align: center;
            border-radius: 8px;
            padding: 1px;
            border: 1px solid;
            font: inherit;
            height: 32px;
            font-size: 10px;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        #wrapper-container {
            width: 80vmin;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: var(--flex-gap)
        }

        #signature-container {
            width: var(--container-size);
            aspect-ratio: 1;
            border-radius: 5%;
        }

        #input-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: var(--flex-gap);
            max-width: var(--container-size);
            min-width: 50%;
        }

        @media (max-width: 600px) {
            #input-container {
                min-width: var(--container-size);
            }
        }
    </style>
</head>

<body>

    <div id="wrapper-container">
        <div id="signature-container">
        </div>
        <div id="input-container">
            <button id="themeButton">light</button>
            <button id="modeButton">static</button>
            <input id="durationInput" type="number" min="0" step="0.5" title="Duration (s)">
            <input id="sizeSlider" type="number" min="10" step="10" title="Adjust Size">
        </div>
    </div>
    <script>
        let theme = "dark"
        let mode = "animated"
        let svgNoo = null
        let timeInterval = null
        let totalDuration = 4

        const themeButton = document.getElementById('themeButton');
        const modeButton = document.getElementById('modeButton');
        const durationInput = document.getElementById('durationInput');
        const sizeSlider = document.getElementById('sizeSlider');

        function updateSize(value) {
            sizeSlider.value = value;
            document.documentElement.style.setProperty('--container-size', `${sizeSlider.value}%`);
        }

        const initialSize = parseFloat(
            getComputedStyle(document.documentElement).getPropertyValue('--container-size')
        );
        sizeSlider.max = initialSize;
        updateSize(initialSize);

        sizeSlider.addEventListener('input', (event) => {
            updateSize(event.target.value);
        });

        document.addEventListener('wheel', (event) => {
            if (!event.ctrlKey) return;

            event.preventDefault();

            const min = Number(sizeSlider.min);
            const max = Number(sizeSlider.max);
            const step = Number(sizeSlider.step) || 4;
            const direction = event.deltaY < 0 ? 1 : -1;
            const nextSize = Math.min(max, Math.max(min, sizeSlider.valueAsNumber + direction * step));

            updateSize(nextSize);
        }, { passive: false });

        durationInput.addEventListener('input', (event) => {
            inputDuration = event.target.valueAsNumber;
            if (isNaN(inputDuration)) {
                totalDuration = 0;
            }
            else {
                totalDuration = inputDuration
            }
            loadAndAnimateSignature()
        });

        themeButton.addEventListener('click', function () {
            theme = theme == 'light' ? 'dark' : 'light'
            themeButton.textContent = theme
            setTheme()
        });
        
        modeButton.addEventListener('click', function () {
            mode = mode == 'animated' ? 'static' : 'animated'
            modeButton.textContent = mode
            loadAndAnimateSignature()
        });
        async function setTheme() {
            let backgroundColor = theme == "light" ? "#ffffff" : "#000000"
            let pathColor = theme == "light" ? "#000000" : "#ffffff"

            let backgroundElement = document.querySelector('#signature-container')
            let bodyElement = document.querySelector('body')

            backgroundElement.style.backgroundColor = backgroundColor
            bodyElement.style.backgroundColor = pathColor
            const pathList = Array.from(document.querySelectorAll('path'));
            pathList.forEach((path, index) => {
                path.style.stroke = pathColor
                path.style.stroke = pathColor
            })
            // inputs
            const inputs = document.querySelectorAll("#input-container > *");
            inputs.forEach(inputElement => {
                inputElement.style.backgroundColor = pathColor
                inputElement.style.color = backgroundColor
                inputElement.style.borderColor = backgroundColor

            });
        }
        async function loadAndAnimateSignature() {
            const isFirstLoad = svgNoo == null;
            if (isFirstLoad) {
                const responseNoo = await fetch('assets/noo.svg');
                svgNoo = await responseNoo.text();
            }
            const container = document.getElementById('signature-container');
            container.innerHTML = svgNoo;
            if (isFirstLoad) {
                // let the browser resolve the SVG's own animation-duration (e.g. "4s") as the default
                const firstPath = container.querySelector('path');
                const defaultDuration = parseFloat(getComputedStyle(firstPath).animationDuration);
                if (!isNaN(defaultDuration)) totalDuration = defaultDuration;
                durationInput.value = totalDuration;
            }
            await setTheme()
            if (mode == 'static') {
                const styleElement = container.querySelector('svg > style');
                if (styleElement) styleElement.remove();
            } else {
                container.querySelectorAll('path').forEach(path => {
                    path.style.animationDuration = `${totalDuration}s`;
                });
            }
        }
        themeButton.click()
        modeButton.click()
    </script>
</body>

</html>
