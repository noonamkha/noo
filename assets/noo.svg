        .ani-3 { animation-name: ani-3; }
        .ani-4 { animation-name: ani-4; }
        .ani-o { animation-name: ani-o; }
        @keyframes ani-1 {
            0%, 10%     { stroke-dashoffset: 0; }
            40%         { stroke-dashoffset: 0.9999; }
            70%, 100%   { stroke-dashoffset: 0; }
        }
        @keyframes ani-2 {
            0%, 20%     { stroke-dashoffset: 0; }
