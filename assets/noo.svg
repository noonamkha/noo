            20%, 60%    { stroke-dashoffset: 1; }
            70%, 100%   { stroke-dashoffset: 0; }
        }
        @keyframes ani-4 {
            0%          { stroke-dashoffset: 0; }
            10%, 70%    { stroke-dashoffset: 1; }
            80%, 100%   { stroke-dashoffset: 0; }
        }
        @keyframes ani-o {
            0%          { stroke-dashoffset: 0; }
            20%, 60%    { stroke-dashoffset: 1; }
